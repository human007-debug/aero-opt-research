# C1 LC3: classical baselines, equal budget. Practical optimum = within 0.1% of the exhaustive optimum
# (Le Riche & Haftka 1995 definition).
name: c1_lc3_baselines
problem: C1_buckling_stacking
overrides:
  loads:
    case: LC3
budget: 3000
seeds:
- 0
- 25
optimizers:
  random:
    module: baselines.random_search
  ga:
    module: baselines.ga
    params:
      pop_size: 50
optimum:
  objective: -1.020224365478013
  rel_tol: 0.001
  source: problems/C1_buckling_stacking/reference_optima.yaml (exhaustive)
plot_sign: -1.0
plot_label: best feasible critical load factor
