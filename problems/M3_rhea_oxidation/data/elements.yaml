# Elemental data for M3 (strength, density).
# Source: pymatgen-core 2026.10.2, pymatgen/core/periodic_table.json.gz (MIT licence), whose values come
# from WebElements and other compilations. Downloaded as a wheel from PyPI on 2026-10-08.
# Derived here: atomic_volume_A3 = molar volume / N_A; shear_modulus_from_E_nu_GPa = E / (2 (1 + nu)).
# shear_modulus_GPa_used: listed rigidity modulus, except Mo (see note). Zr and Hf listed/derived disagree by
# 30% and 5%; the listed values are used pending a primary source.
# Known source error: Mo 'Rigidity modulus' is listed as 20 GPa; E/(2(1+nu)) gives 125.6 GPa, consistent with
# the other elements whose listed and derived values agree. The derived value is used.
# Si has no listed nu or G, and its stable form is not a metal; it is excluded from the strength model.
# Atomic volumes are those of each element's stable structure at room temperature (hcp for Ti, Zr, Hf; fcc for
# Al; diamond for Si). TODO: verify from source which volumes Maresca & Curtin (2020) use for Al, Ti, Zr, Hf.
